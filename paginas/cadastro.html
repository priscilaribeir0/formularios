<!DOCTYPE html>
<html>
<head>
  <title>Cadastro</title>
  <link rel="stylesheet" href="../estilo/estilo.css">
</head>
<body>

  <h2>Cadastro</h2>

  <form>
    <div>
      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" required>
    </div>

    <div>
      <label for="login">Login:</label>
      <input type="text" id="login" name="login">
    </div>

    <div>
      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required>
    </div>

    <div>
      <label for="confirmar_senha">Confirmar Senha:</label>
      <input type="password" id="confirmar_senha" name="confirmar_senha" required>
    </div>

    <div>
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>
    </div>

    <h3>Dados de Contato</h3>

    <div>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome">
    </div>

    <div>
      <label for="sobrenome">Sobrenome:</label>
      <input type="text" id="sobrenome" name="sobrenome">
    </div>

    <div>
      <label for="nascimento">Nascimento:</label>
      <input type="text" id="nascimento" name="nascimento" pattern="dd/mm/aaaa">
    </div>

    <div>
      <label for="sexo">Sexo:</label>
      <select id="sexo" name="sexo">
        <option value="">Selecione</option>
        <option value="masculino">Masculino</option>
        <option value="feminino">Feminino</option>
        <option value="outro">Outro</option>
      </select>
    </div>

    <div>
      <label for="cep">CEP:</label>
      <input type="text" id="cep" name="cep" pattern="[0-9]{5}-[0-9]{3}" required>
      <button type="button">Pesquisar</button>
    </div>

    <div>
      <label for="endereco">Endereço:</label>
      <input type="text" id="endereco" name="endereco">
    </div>

    <div>
      <label for="complemento">Complemento:</label>
      <input type="text" id="complemento" name="complemento">
    </div>

    <div>
      <label for="cidade">Cidade:</label>
      <input type="text" id="cidade" name="cidade">
    </div>

    <div>
      <label for="estado">Estado:</label>
      <select id="estado" name="estado">
        <option value="">Selecione</option>
        <option value="sp">São Paulo</option>
        <option value="rj">Rio de Janeiro</option>
        </select>
    </div>

    <div>
      <label for="ddd">DDD+Telefone:</label>
      <input type="text" id="ddd" name="ddd">
    </div>

    <div>
      <label for="celular">DDD+Celular:</label>
      <input type="text" id="celular" name="celular">
    </div>

    <button type="submit">Confirmar</button>
  </form>

</body>
</html>
